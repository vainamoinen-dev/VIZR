name: Report a problem
description: Something did not work. Say what you did and what happened, and attach the session's two log files.
body:
  - type: textarea
    id: what-you-did
    attributes:
      label: What you did
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Your headset
      placeholder: e.g. Quest 3
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Your GPU
      placeholder: e.g. GeForce RTX 4070
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Your VR runtime
      placeholder: Virtual Desktop, SteamVR or the Meta app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The two log files
      description: >-
        Each session writes a folder under logs\ in the install folder with launch.txt and eden_log.txt. Attach those
        two files here. They name folders on your PC, so look them over first.
    validations:
      required: true
